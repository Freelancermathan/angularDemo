<!-- *ngIf Example -->
<div *ngIf="isLoggedIn">
  <h2>Welcome Back 👋</h2>
</div>

<!-- *ngFor Example -->
<ul>
  <li *ngFor="let user of users; let i = index">
    {{ i + 1 }} - {{ user }}
  </li>
</ul>


<div [ngSwitch]="role">

  <h2 *ngSwitchCase="'admin'">Welcome Admin 👑</h2>

  <h2 *ngSwitchCase="'user'">Welcome User 👋</h2>

  <h2 *ngSwitchCase="'guest'">Welcome Guest 🙂</h2>

  <h2 *ngSwitchDefault>Access Denied ❌</h2>

</div>
