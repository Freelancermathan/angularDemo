<section class="section contact-section">
  <div class="container contact-wrapper">

    <h2 class="contact-title">Contact Us</h2>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="contact-form">

        <input formControlName="name" placeholder="Your name" class="neon-input" />
        <div class="error" *ngIf="contactForm.controls.name.invalid && contactForm.controls.name.touched">
          Name is required (min 2 chars).
        </div>

        <input formControlName="email" placeholder="Your email" class="neon-input" />
        <div class="error" *ngIf="contactForm.controls.email.invalid && contactForm.controls.email.touched">
          Valid email required.
        </div>

        <textarea formControlName="message" rows="6" placeholder="Message" class="neon-input"></textarea>
        <div class="error" *ngIf="contactForm.controls.message.invalid && contactForm.controls.message.touched">
          Message is required (min 6 chars).
        </div>

        <button class="neon-btn" type="submit">Send Message</button>
      </div>
    </form>

  </div>
</section>
